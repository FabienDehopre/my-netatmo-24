  '@ngx-env/builder': 21.0.1
  '@stoplight/spectral-cli': 6.17.0
  '@types/node': 24.19.2
  dotenv: 17.4.2
  jsdom: 29.1.1
  postcss: 8.5.31
  rxjs: 7.8.2
  temporal-polyfill: 1.0.6
  tslib: 2.8.1
  typescript: 6.0.3
  zod: 4.6.7
  zone.js: 0.16.3

