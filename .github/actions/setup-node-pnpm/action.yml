name: Setup Node.js and pnpm
description: Install pnpm, set up Node.js with pnpm cache, and install dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: lts/*
        check-latest: true
        cache: pnpm
    - run: pnpm install --prefer-offline --frozen-lockfile --recursive
      shell: bash
